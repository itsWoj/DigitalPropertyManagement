<!DOCTYPE html>
<html>
<head>
    <title>Request Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .confirmation { background: #f0fff0; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="confirmation">
        <h1>Request Submitted Successfully</h1>
        <p>Your request (#{{ request.RequestID }}) has been assigned to:</p>
        <p><strong>{{ request.FirstName }} {{ request.LastName }}</strong></p>
        <p><strong>Issue:</strong> {{ request.Description }}</p>
        <p><strong>Status:</strong> {{ request.Status }}</p>
        <p><strong>Submitted:</strong> {{ request.CreatedAt.strftime('%Y-%m-%d %H:%M') }}</p>
        
        <a href="/tenant/dashboard" style="display: inline-block; margin-top: 20px; padding: 10px 15px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px;">
            Return to Dashboard
        </a>
    </div>
</body>
</html>
